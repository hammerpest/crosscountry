<!doctype html>
<html lang="en-AU" class="homes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAS Cross Country</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;800;900&family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="ticker" id="tick" aria-hidden="true"></div>
<header class="top">
  <div class="wrap">
    <div class="topin">
      <span class="jobbadge" id="jobBadge" hidden></span>
      <div class="brand"><span class="names"><h1 id="evName">CCAS Cross Country</h1><small id="evSub">Nihil sine Deo · Results by ticket</small></span></div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Connecting</span></div>
      <div class="jobpill" id="jobPill" hidden></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="home" hidden></section>
  <div id="app" hidden>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-record" data-view="record" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M14 7v12" stroke-dasharray="2 2"/></svg><span>Record</span></button>
      <button role="tab" id="tab-results" data-view="results" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>Results</span></button>
      <button role="tab" id="tab-houses" data-view="houses" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10l8-6 8 6v10z"/><path d="M10 20v-6h4v6"/></svg><span>Houses</span></button>
      <button role="tab" id="tab-setup" data-view="setup" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Setup</span></button>
    </nav>
    <div id="lockBanner" class="msg ok" style="margin-bottom:14px;font-weight:600" hidden></div>
    <section id="v-record"></section>
    <section id="v-results" hidden></section>
    <section id="v-houses" hidden></section>
    <section id="v-setup" hidden></section>
  </div>
</main>
<button type="button" id="quick" hidden></button>
<div class="toast" id="toast" role="status" hidden></div>
<!-- XC Opt 15.1 -->
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
